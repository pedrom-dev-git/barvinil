# Publishes the landing page to GitHub Pages.
#
# Pages serves a project repo from a subdirectory, so the build runs with
# NEXT_PUBLIC_BASE_PATH set and every URL in the export carries that prefix.
# tests/export.spec.ts checks exactly that, against the files about to be uploaded —
# a base path mistake deploys green and renders an unstyled page.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The two Pages scopes live on the deploy job alone: build is
# where third-party code runs (the dependency tree, next build, eslint plugins), and
# it has no business holding a token that can publish or mint an OIDC identity.
permissions:
  contents: read

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing after this step talks to the remote; leaving the token in
          # .git/config only widens what a compromised dependency can reach.
          persist-credentials: false

      # Pinned to the commit v4 resolved to on 2026-09-10. The GitHub-owned actions
      # below ride their tags; this one is third-party, and it runs in the job that
      # installs the dependency tree.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # pnpm version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Builds the export AND asserts the Pages contract. No separate build step:
      # this is the artifact that gets uploaded. No actions/configure-pages here —
      # its job is to guess a framework's base path, and this one is set explicitly.
      - run: pnpm test:export

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
