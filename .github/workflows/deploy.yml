# Publishes the landing page to GitHub Pages.
#
# Pages serves a project repo from a subdirectory, so the build runs with
# NEXT_PUBLIC_BASE_PATH set and every URL in the export carries that prefix.
# tests/export.spec.ts checks exactly that, against the files about to be uploaded —
# a base path mistake deploys green and renders an unstyled page.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Builds the export AND asserts the Pages contract. No separate build step:
      # this is the artifact that gets uploaded.
      - run: pnpm test:export

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
